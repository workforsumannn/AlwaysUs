<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat • AlwaysUs</title>
    <meta name="theme-color" content="#050810">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=JetBrains+Mono:wght@300;400;500;600&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyber-bg">
        <div class="grid"></div>
        <canvas id="particles-canvas"></canvas>
        <div class="scanline"></div>
    </div>

    <div id="app">
        <div id="chat-screen" class="screen active">
            <div class="chat-topbar">
                <div class="topbar-left">
                    <div class="avatar" id="chat-avatar">A</div>
                    <div class="topbar-info">
                        <span class="companion-name" id="chat-name">Aria</span>
                        <span class="status"><span class="online-dot"></span> Online</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <button id="menu-toggle" class="icon-btn">☰</button>
                </div>
            </div>

            <div id="menu-dropdown" class="menu-dropdown">
                <button id="menu-change-role">🔄 Change Role</button>
                <button id="menu-clear-chat">🗑 Clear Chat</button>
                <button id="menu-logout">🚪 Logout</button>
            </div>

            <div class="chat-area" id="chat-area"></div>

            <div class="typing-indicator" id="typing-indicator">
                <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            </div>

            <div class="chat-input-area">
                <button id="attach-btn" class="icon-btn attach-btn">+</button>
                <div id="attach-menu" class="attach-menu">
                    <button id="attach-photo">📷 Photo</button>
                    <button id="attach-file">📎 File</button>
                </div>
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                <button id="send-btn" class="send-btn">➤</button>
            </div>

            <input type="file" id="photo-input" accept="image/*" hidden>
            <input type="file" id="file-input" accept=".txt,.md,.json,.csv,.log,.js,.py,.html,.css" hidden>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
