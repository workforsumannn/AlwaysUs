<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat • AlwaysUs</title>
    <meta name="theme-color" content="#0a0308">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=JetBrains+Mono:wght@300;400;500;600&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyber-bg">
        <div class="grid"></div>
        <canvas id="particles-canvas"></canvas>
        <div class="scanline"></div>
    </div>

    <div id="app">
        <div id="chat-screen" class="screen active">

            <!-- TOPBAR -->
            <div class="gem-topbar">
                <button id="menu-toggle" class="gem-icon-btn" title="Menu">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="gem-topbar-title">
                    <span class="gem-title-icon">∞</span>
                    <span class="gem-title-text">AlwaysUs</span>
                </div>
                <div class="gem-topbar-spacer"></div>
            </div>

            <div class="gem-topline"></div>

            <!-- SIDEBAR -->
            <div id="gem-sidebar" class="gem-sidebar">
                <div class="gem-sidebar-header">
                    <span class="gem-sidebar-logo">∞ AlwaysUs</span>
                    <button id="sidebar-close" class="gem-icon-btn small">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <div class="gem-sidebar-menu">
                    <button id="menu-new-chat" class="gem-menu-item">
                        <svg class="gem-menu-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>New Chat</span>
                    </button>

                    <button id="menu-history" class="gem-menu-item">
                        <svg class="gem-menu-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span>Chat History</span>
                    </button>

                    <button id="menu-change-role" class="gem-menu-item">
                        <svg class="gem-menu-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <polyline points="1 20 1 14 7 14"></polyline>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                        <span>Change Companion</span>
                    </button>

                    <button id="menu-clear-chat" class="gem-menu-item">
                        <svg class="gem-menu-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                        <span>Clear Chat</span>
                    </button>

                    <div class="gem-menu-divider"></div>

                    <button id="menu-logout" class="gem-menu-item danger">
                        <svg class="gem-menu-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        <span>Logout</span>
                    </button>
                </div>

                <div class="gem-sidebar-footer">
                    <span class="gem-companion-badge" id="sidebar-companion">Aria • GF</span>
                </div>
            </div>
            <div id="sidebar-overlay" class="gem-overlay"></div>

            <!-- CHAT MESSAGES -->
            <div class="gem-chat-area" id="chat-area"></div>

            <!-- TYPING -->
            <div class="gem-typing" id="typing-indicator">
                <span class="gem-typing-dot"></span>
                <span class="gem-typing-dot"></span>
                <span class="gem-typing-dot"></span>
            </div>

            <!-- INPUT -->
            <div class="gem-input-wrap">
                <div class="gem-input-bar">
                    <button id="attach-btn" class="gem-input-btn" title="Attach">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                    <div id="attach-menu" class="gem-attach-menu">
                        <button id="attach-photo">
                            <svg class="gem-menu-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                            <span>Photo</span>
                        </button>
                        <button id="attach-file">
                            <svg class="gem-menu-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                            </svg>
                            <span>File</span>
                        </button>
                    </div>
                    <input type="text" id="message-input" placeholder="Message..." autocomplete="off">
                    <button id="send-btn" class="gem-send-btn" title="Send">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- HISTORY MODAL -->
            <div id="history-modal" class="gem-modal">
                <div class="gem-modal-content">
                    <div class="gem-modal-header">
                        <span class="gem-modal-title">Chat History</span>
                        <button id="history-close" class="gem-icon-btn small">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="gem-modal-body" id="history-body"></div>
                </div>
            </div>

            <input type="file" id="photo-input" accept="image/*" hidden>
            <input type="file" id="file-input" accept=".txt,.md,.json,.csv,.log,.js,.py,.html,.css" hidden>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
