<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ek Chhoti Si Kitab - Subhashree Ji Ke Liye</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: radial-gradient(ellipse at top, #2b0a3d 0%, #1a0033 55%, #0d001a 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    color: #fff;
    padding: 20px 12px;
    position: relative;
    perspective: 2000px;
  }

  /* Stars */
  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s infinite;
    z-index: 1;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.12; }
    50%      { opacity: 1; box-shadow: 0 0 8px #fff, 0 0 12px #ffd6e8; }
  }

  /* Floating hearts */
  .css-heart {
    position: absolute;
    background: #ff6b9d;
    transform: rotate(-45deg);
    animation: floatUp linear infinite;
    pointer-events: none;
    opacity: 0.35;
    z-index: 1;
  }
  .css-heart::before, .css-heart::after {
    content: '';
    position: absolute;
    background: inherit;
    border-radius: 50%;
    width: var(--s); height: var(--s);
  }
  .css-heart::before { top: calc(var(--s) / -2); left: 0; }
  .css-heart::after  { top: 0; left: calc(var(--s) / 2); }
  @keyframes floatUp {
    0%   { transform: translateY(100vh) rotate(-45deg) scale(0.4); opacity: 0; }
    10%  { opacity: 0.4; }
    100% { transform: translateY(-120px) rotate(-45deg) scale(1.1); opacity: 0; }
  }

  /* ============ SCREEN SYSTEM ============ */
  .screen {
    display: none;
    width: 100%;
    max-width: 800px;
    z-index: 10;
    animation: fadeIn 0.9s ease;
  }
  .screen.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ============ LOGIN ============ */
  .login-card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 156, 199, 0.25);
    border-radius: 28px;
    padding: 45px 35px;
    max-width: 440px;
    margin: 0 auto;
    text-align: center;
    box-shadow: 0 20px 60px rgba(196, 77, 255, 0.15);
  }

  .lock-svg { width: 66px; height: 66px; margin-bottom: 14px; animation: pulse 2.5s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.08); }
  }

  .login-title {
    font-size: 1.7em;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #ff9ec7, #ffd6e8, #c44dff, #ff9ec7);
    background-size: 300% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shine 4s linear infinite;
    letter-spacing: 1px;
  }
  @keyframes shine { to { background-position: 300% center; } }

  .login-sub {
    font-size: 0.92em;
    color: #ffd6e8;
    margin-bottom: 24px;
    font-style: italic;
    opacity: 0.88;
    line-height: 1.6;
  }

  .pin-input {
    width: 100%;
    padding: 16px;
    font-size: 1.55em;
    text-align: center;
    letter-spacing: 12px;
    border-radius: 16px;
    border: 2px solid rgba(255, 156, 199, 0.35);
    background: rgba(255, 156, 199, 0.08);
    color: #ffd6e8;
    font-family: 'Courier New', monospace;
    outline: none;
    transition: all 0.3s;
  }
  .pin-input:focus {
    border-color: #ff9ec7;
    box-shadow: 0 0 20px rgba(255, 107, 157, 0.4);
  }
  .pin-input::placeholder {
    color: rgba(255, 214, 232, 0.3);
    letter-spacing: 4px;
    font-size: 0.65em;
  }
  .hint { font-size: 0.82em; color: #d4a5d4; margin-top: 10px; opacity: 0.75; font-style: italic; }

  .unlock-btn {
    margin-top: 22px;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 50px;
    font-size: 1em;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: linear-gradient(135deg, #ff6b9d, #c44dff);
    color: #fff;
    box-shadow: 0 6px 22px rgba(255, 107, 157, 0.4);
    transition: all 0.3s;
    letter-spacing: 1px;
  }
  .unlock-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 10px 30px rgba(255,107,157,0.6); }

  .error { color: #ff7a7a; font-size: 0.87em; margin-top: 12px; min-height: 20px; opacity: 0; transition: opacity 0.3s; }
  .error.show { opacity: 1; }
  .shake { animation: shakeCard 0.5s ease; }
  @keyframes shakeCard {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-12px); }
    40% { transform: translateX(12px); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(8px); }
  }

  /* ============ THE BOOK ============ */
  .book {
    position: relative;
    width: 100%;
    max-width: 800px;
    height: 660px;
    margin: 0 auto;
    perspective: 2400px;
    filter: drop-shadow(0 30px 60px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 40px rgba(196, 77, 255, 0.25));
  }

  .book-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    border-radius: 6px 14px 14px 6px;
    background: #2a1a2e;
    box-shadow:
      inset 0 0 0 1px rgba(255, 200, 220, 0.08),
      inset 8px 0 24px -10px rgba(0,0,0,0.5);
  }

  .spine {
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: 22px;
    transform: translateX(-50%);
    background: linear-gradient(90deg,
      rgba(0,0,0,0.35) 0%,
      rgba(0,0,0,0.12) 30%,
      rgba(0,0,0,0.55) 50%,
      rgba(0,0,0,0.12) 70%,
      rgba(0,0,0,0.35) 100%);
    z-index: 15;
    pointer-events: none;
    border-radius: 2px;
    box-shadow: 0 0 12px rgba(0,0,0,0.5);
  }

  .page-left, .page-right {
    position: absolute;
    top: 0; bottom: 0;
    width: 50%;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255, 250, 240, 0.06), transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(180, 120, 90, 0.08), transparent 60%),
      linear-gradient(135deg, #fdf6e3 0%, #f5ecd5 45%, #ede1c4 100%);
    overflow: hidden;
    z-index: 5;
  }
  .page-left {
    left: 0;
    border-radius: 6px 0 0 6px;
    box-shadow:
      inset -10px 0 20px -8px rgba(120, 80, 40, 0.35),
      inset 4px 0 10px -6px rgba(255,255,255,0.6);
  }
  .page-right {
    right: 0;
    border-radius: 0 14px 14px 0;
    box-shadow:
      inset 10px 0 20px -8px rgba(120, 80, 40, 0.35),
      inset -4px 0 10px -6px rgba(255,255,255,0.6);
  }

  .paper-texture {
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(120,80,40,0.06) 27px, rgba(120,80,40,0.06) 28px),
      radial-gradient(circle at 20% 30%, rgba(150, 100, 60, 0.05) 0%, transparent 30%),
      radial-gradient(circle at 70% 70%, rgba(150, 100, 60, 0.05) 0%, transparent 30%);
    pointer-events: none;
    opacity: 0.7;
    z-index: 6;
  }

  .page-num {
    position: absolute;
    bottom: 18px;
    font-family: 'Georgia', serif;
    font-size: 0.78em;
    color: #a08860;
    font-style: italic;
    letter-spacing: 1px;
    z-index: 8;
  }
  .page-num.left { left: 24px; }
  .page-num.right { right: 24px; }

  .page-content {
    position: absolute;
    inset: 0;
    padding: 45px 42px 55px;
    color: #3b2a1e;
    font-family: 'Georgia', 'Times New Roman', serif;
    display: flex;
    flex-direction: column;
    z-index: 7;
    overflow-y: auto;
  }
  .page-content::-webkit-scrollbar { width: 4px; }
  .page-content::-webkit-scrollbar-thumb { background: rgba(120,80,40,0.3); border-radius: 4px; }

  .page-content h2 {
    font-family: 'Georgia', serif;
    font-size: 1.55em;
    color: #6b2a4a;
    margin-bottom: 6px;
    font-style: italic;
    letter-spacing: 0.5px;
    line-height: 1.3;
  }
  .page-content .date {
    font-size: 0.78em;
    color: #a08860;
    margin-bottom: 22px;
    font-style: italic;
    letter-spacing: 0.5px;
  }
  .page-content p {
    font-size: 0.97em;
    line-height: 1.85;
    margin-bottom: 13px;
    color: #3b2a1e;
    text-align: left;
  }
  .page-content .drop-cap::first-letter {
    font-size: 2.8em;
    float: left;
    line-height: 0.9;
    padding: 6px 8px 0 0;
    color: #8b2a5a;
    font-family: 'Georgia', serif;
    font-weight: 700;
  }
  .page-content .hl { color: #8b2a5a; font-weight: 600; font-style: italic; }
  .page-content .signature {
    margin-top: auto;
    padding-top: 20px;
    font-style: italic;
    color: #6b2a4a;
    font-size: 0.95em;
    text-align: right;
    border-top: 1px dashed rgba(120, 80, 40, 0.25);
  }

  /* Page flip */
  .flip-layer {
    position: absolute;
    top: 0; bottom: 0;
    width: 50%;
    background: linear-gradient(135deg, #fdf6e3 0%, #f5ecd5 45%, #ede1c4 100%);
    z-index: 12;
    transform-origin: right center;
    backface-visibility: hidden;
    border-radius: 6px 0 0 6px;
    box-shadow: inset -10px 0 20px -8px rgba(120, 80, 40, 0.35);
    pointer-events: none;
    opacity: 0;
  }
  .flip-layer.right-side {
    left: 50%;
    transform-origin: left center;
    border-radius: 0 14px 14px 0;
    box-shadow: inset 10px 0 20px -8px rgba(120, 80, 40, 0.35);
  }
  .flip-layer.flipping-left { animation: flipLeft 0.9s ease forwards; }
  .flip-layer.flipping-right { animation: flipRight 0.9s ease forwards; }
  @keyframes flipLeft {
    0%   { opacity: 0; transform: rotateY(0deg); }
    10%  { opacity: 1; }
    100% { opacity: 0; transform: rotateY(-180deg); }
  }
  @keyframes flipRight {
    0%   { opacity: 0; transform: rotateY(0deg); }
    10%  { opacity: 1; }
    100% { opacity: 0; transform: rotateY(180deg); }
  }

  /* Nav buttons */
  .nav-row {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin-top: 22px;
    flex-wrap: wrap;
    z-index: 20;
    position: relative;
  }

  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 26px;
    border: none;
    border-radius: 50px;
    font-family: inherit;
    font-size: 0.95em;
    font-weight: 600;
    cursor: pointer;
    background: rgba(255, 156, 199, 0.15);
    color: #ffd6e8;
    border: 1px solid rgba(255, 156, 199, 0.4);
    transition: all 0.3s;
    letter-spacing: 0.5px;
  }
  .nav-btn:hover { background: rgba(255,156,199,0.28); transform: translateY(-2px); border-color: #ff9ec7; }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

  .nav-btn.next-btn {
    background: linear-gradient(135deg, #ff6b9d, #c44dff);
    color: #fff;
    border: none;
    box-shadow: 0 6px 22px rgba(255, 107, 157, 0.4);
  }
  .nav-btn.next-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(255,107,157,0.6); }

  .btn-icon { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

  /* Interactive elements */
  .heart-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border: none;
    border-radius: 40px;
    font-family: inherit;
    font-size: 0.88em;
    font-weight: 600;
    cursor: pointer;
    background: linear-gradient(135deg, #ff6b9d, #c44dff);
    color: #fff;
    box-shadow: 0 4px 14px rgba(255, 107, 157, 0.35);
    transition: all 0.3s;
    margin-top: 10px;
    align-self: flex-start;
  }
  .heart-btn:hover { transform: translateY(-2px) scale(1.04); }

  .joke-text {
    font-style: italic;
    color: #6b2a4a;
    font-size: 1em;
    line-height: 1.7;
    padding: 14px 16px;
    background: rgba(139, 42, 90, 0.06);
    border-left: 3px solid #8b2a5a;
    border-radius: 0 10px 10px 0;
    margin: 8px 0 12px;
    min-height: 70px;
    transition: opacity 0.3s;
  }

  .question-text {
    font-size: 1.15em;
    color: #6b2a4a;
    line-height: 1.6;
    margin: 20px 0 26px;
    font-style: italic;
    text-align: center;
  }

  .qa-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 10px;
    position: relative;
    min-height: 70px;
  }

  .qa-btn {
    padding: 13px 30px;
    border: none;
    border-radius: 50px;
    font-family: inherit;
    font-size: 1em;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.4s ease;
    letter-spacing: 0.5px;
  }
  .qa-yes {
    background: linear-gradient(135deg, #ff6b9d, #c44dff);
    color: #fff;
    box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
  }
  .qa-yes:hover { transform: translateY(-2px) scale(1.05); }

  .qa-no {
    background: rgba(139, 42, 90, 0.1);
    color: #6b2a4a;
    border: 1px solid rgba(139, 42, 90, 0.35);
  }

  .no-hint {
    font-size: 0.85em;
    color: #8b2a5a;
    font-style: italic;
    text-align: center;
    margin-top: 14px;
    min-height: 22px;
    opacity: 0;
    transition: opacity 0.4s;
  }

  .final-heart {
    width: 54px; height: 54px;
    background: linear-gradient(135deg, #ff6b9d, #c44dff);
    transform: rotate(-45deg);
    position: relative;
    margin: 12px auto 26px;
    animation: heartbeat 1.3s ease-in-out infinite;
    box-shadow: 0 0 24px rgba(255, 107, 157, 0.6);
  }
  .final-heart::before, .final-heart::after {
    content: '';
    position: absolute;
    width: 54px; height: 54px;
    background: inherit;
    border-radius: 50%;
  }
  .final-heart::before { top: -27px; left: 0; }
  .final-heart::after  { top: 0; left: 27px; }
  @keyframes heartbeat {
    0%, 100% { transform: rotate(-45deg) scale(1); }
    25%      { transform: rotate(-45deg) scale(1.15); }
    50%      { transform: rotate(-45deg) scale(1); }
    75%      { transform: rotate(-45deg) scale(1.1); }
  }

  .final-title {
    font-size: 1.55em;
    color: #8b2a5a;
    text-align: center;
    margin-bottom: 14px;
    font-style: italic;
  }

  .final-text {
    font-size: 0.96em;
    color: #3b2a1e;
    line-height: 1.9;
    text-align: center;
    font-style: italic;
    margin-bottom: 16px;
  }

  .wa-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border: none;
    border-radius: 50px;
    font-family: inherit;
    font-size: 0.92em;
    font-weight: 700;
    cursor: pointer;
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: #fff;
    box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
    transition: all 0.3s;
    margin: 8px auto 0;
    width: fit-content;
  }
  .wa-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(37,211,102,0.6); }

  .corner-fold {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 0; height: 0;
    border-style: solid;
    border-width: 0 0 40px 40px;
    border-color: transparent transparent rgba(120, 80, 40, 0.15) transparent;
    z-index: 9;
    pointer-events: none;
  }

  /* Floating music notes */
  .note {
    position: absolute;
    width: 11px; height: 11px;
    background: #ff9ec7;
    border-radius: 50%;
    pointer-events: none;
    animation: floatNote 3.5s linear infinite;
    opacity: 0;
    z-index: 2;
  }
  .note::after {
    content: '';
    position: absolute;
    right: -1px; bottom: 7px;
    width: 2px; height: 20px;
    background: #ff9ec7;
  }
  @keyframes floatNote {
    0%   { transform: translateY(0) rotate(0); opacity: 0; }
    20%  { opacity: 0.8; }
    100% { transform: translateY(-220px) rotate(180deg); opacity: 0; }
  }

  /* Music indicator badge */
  .music-badge {
    position: fixed;
    top: 16px;
    right: 16px;
    background: rgba(255, 156, 199, 0.15);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 156, 199, 0.4);
    border-radius: 40px;
    padding: 8px 16px;
    font-size: 0.82em;
    color: #ffd6e8;
    font-family: inherit;
    z-index: 50;
    display: none;
    align-items: center;
    gap: 8px;
    animation: fadeIn 0.5s ease;
  }
  .music-badge.show { display: flex; }

  .music-bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 14px;
  }
  .music-bars span {
    width: 3px;
    background: #ff9ec7;
    border-radius: 2px;
    animation: barPulse 0.9s ease-in-out infinite;
  }
  .music-bars span:nth-child(1) { animation-delay: 0s; height: 6px; }
  .music-bars span:nth-child(2) { animation-delay: 0.15s; height: 10px; }
  .music-bars span:nth-child(3) { animation-delay: 0.3s; height: 8px; }
  .music-bars span:nth-child(4) { animation-delay: 0.45s; height: 12px; }
  @keyframes barPulse {
    0%, 100% { transform: scaleY(0.4); }
    50%      { transform: scaleY(1); }
  }

  @media (max-width: 720px) {
    .book { height: 620px; perspective: 1800px; }
    .page-content { padding: 35px 26px 50px; }
    .page-content h2 { font-size: 1.3em; }
    .page-content p { font-size: 0.9em; line-height: 1.75; }
  }

  @media (max-width: 560px) {
    body { padding: 14px 8px; }
    .book { height: 660px; }
    .page-content { padding: 26px 18px 42px; }
    .page-content h2 { font-size: 1.15em; }
    .page-content p { font-size: 0.85em; line-height: 1.7; margin-bottom: 10px; }
    .page-content .drop-cap::first-letter { font-size: 2.3em; padding: 4px 6px 0 0; }
    .nav-btn { padding: 10px 18px; font-size: 0.85em; }
    .qa-btn { padding: 11px 22px; font-size: 0.9em; }
    .login-title { font-size: 1.4em; }
    .music-badge { top: 8px; right: 8px; padding: 6px 12px; font-size: 0.75em; }
  }

  @media (max-width: 400px) {
    .book { height: 640px; }
    .page-content { padding: 22px 14px 38px; }
  }
</style>
</head>
<body>

<!-- Music badge (visible after login) -->
<div class="music-badge" id="musicBadge">
  <div class="music-bars"><span></span><span></span><span></span><span></span></div>
  <span>Music chal rahi hai</span>
</div>

<!-- ============ SCREEN 1: LOGIN ============ -->
<div class="screen active" id="screenLogin">
  <div class="login-card" id="loginCard">
    <svg class="lock-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 0 1 6 0v3H9zm3 5a2 2 0 0 1 1 3.73V19a1 1 0 0 1-2 0v-1.27A2 2 0 0 1 12 14z" fill="#ff9ec7"/>
    </svg>
    <h1 class="login-title">Ek Chhoti Si Kitab</h1>
    <p class="login-sub">Subhashree ji, yeh kitab sirf aapke liye likhi gayi hai.<br>Kholne ke liye apna code daaliye.</p>
    <input type="password" inputmode="numeric" maxlength="6" class="pin-input" id="pinInput" placeholder="Code" autocomplete="off">
    <p class="hint">Sanket: aapki pasandeeda tareekh (digit mein)</p>
    <button class="unlock-btn" onclick="checkPin()">Kitab Kholiye</button>
    <p class="error" id="errorMsg">Yeh code sahi nahi hai. Kripya punah prayas kijiye.</p>
  </div>
</div>

<!-- ============ SCREEN 2: THE BOOK ============ -->
<div class="screen" id="screenBook">
  <div class="book">
    <div class="book-inner">
      <div class="spine"></div>

      <div class="page-left">
        <div class="paper-texture"></div>
        <div class="page-content" id="leftContent"></div>
        <div class="page-num left" id="leftNum">1</div>
        <div class="corner-fold"></div>
      </div>

      <div class="page-right">
        <div class="paper-texture"></div>
        <div class="page-content" id="rightContent"></div>
        <div class="page-num right" id="rightNum">2</div>
        <div class="corner-fold"></div>
      </div>

      <div class="flip-layer" id="flipLeft"></div>
      <div class="flip-layer right-side" id="flipRight"></div>
    </div>
  </div>

  <div class="nav-row">
    <button class="nav-btn" id="prevBtn" onclick="prevPage()">
      <svg class="btn-icon" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7z"/></svg>
      Pichla Panza
    </button>
    <button class="nav-btn next-btn" id="nextBtn" onclick="nextPage()">

      <svg class="btn-icon" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7z"/></svg>

</div>

<audio id="voiceAudio" preload="auto" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3" type="audio/mpeg">
</audio>

<script>
  /* ===== Stars ===== */
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDelay = Math.random() * 3 + 's';
    document.body.appendChild(s);
  }

  /* ===== Floating hearts ===== */
  const heartColors = ['#ff6b9d', '#ff9ec7', '#c44dff', '#ffd6e8', '#b366ff'];
  setInterval(() => {
    const h = document.createElement('div');
    h.className = 'css-heart';
    const size = 12 + Math.random() * 14;
    h.style.width = size + 'px';
    h.style.height = size + 'px';
    h.style.setProperty('--s', size + 'px');
    h.style.background = heartColors[Math.floor(Math.random() * heartColors.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.animationDuration = (8 + Math.random() * 6) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 14000);
  }, 700);

  function burstHearts(count) {
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const h = document.createElement('div');
        h.className = 'css-heart';
        const size = 14 + Math.random() * 14;
        h.style.width = size + 'px';
        h.style.height = size + 'px';
        h.style.setProperty('--s', size + 'px');
        h.style.background = heartColors[Math.floor(Math.random() * heartColors.length)];
        h.style.left = (35 + Math.random() * 30) + 'vw';
        h.style.animationDuration = '2.4s';
        h.style.opacity = '1';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 2800);
      }, i * 60);
    }
  }

  /* ===== Screen nav ===== */
  function goTo(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ===== PIN + Music autoplay after login ===== */
  const VALID_CODES = ['02', '2', '0206', '02062025', '062'];
  const voiceAudio = document.getElementById('voiceAudio');
  let voicePlaying = false;

  function checkPin() {
    const input = document.getElementById('pinInput').value.trim();
    const card = document.getElementById('loginCard');
    const error = document.getElementById('errorMsg');

    if (VALID_CODES.includes(input)) {
      error.classList.remove('show');
      goTo('screenBook');
      renderBook();
      // Music autoplay ONLY after successful login
      setTimeout(() => {
        voiceAudio.volume = 0.4;
        voiceAudio.play().then(() => {
          voicePlaying = true;
          updateVoiceButtons();
          spawnNotes();
          document.getElementById('musicBadge').classList.add('show');
        }).catch(() => {
          // Autoplay blocked — user will need to click
          voicePlaying = false;
          updateVoiceButtons();
        });
      }, 500);
    } else {
      card.classList.add('shake');
      error.classList.add('show');
      setTimeout(() => card.classList.remove('shake'), 500);
      document.getElementById('pinInput').value = '';
    }
  }
  document.getElementById('pinInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') checkPin();
  });
  document.getElementById('pinInput').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^0-9]/g, '');
  });

  /* ============================================================
     THE BOOK PAGES — respectful language, "aap" everywhere
     ============================================================ */
  const SPREADS = [
    // Spread 1 — Page 1 & 2

      left: {
        pageNum: 1,
        html: `
          <h2>Ek Chhoti Si Kitab</h2>

          <p>Mujhe gyaan hai ki aap naraaz hain, aur iska haqdaar bhi hoon main.</p>
          <p>Kintu is kitab ko padhte hue, meri ek hi ichha hai &mdash; ki aapke chehre par ek chhoti si muskaan aa jaye.</p>

      right: {

        html: `
          <h2>Kshama</h2>

    // Spread 2 — Page 3 & 4
    {

        pageNum: 3,
        html: `
          <h2>Meri Awaaz</h2>
          <p class="date">Ek sandesh, aapke liye</p>
          <p>Kuch baatein likhkar nahi keh sakta. Isliye ek chhota sa sandesh bhej raha hoon&hellip;</p>
          <p>Kripya suniye. Bas ek baar.</p>
          <button class="heart-btn" onclick="toggleVoice()" id="voiceBtnLeft">

          <p>1. Maine aapki baat dhyan se nahi suni, jab aap sunna chahti thi.</p>
          <p>2. Maine apne ahankar ko aapse upar rakha, jo galat tha.</p>
          <p>3. Maine aapko woh samay nahi diya jo aap arjun karti thi.</p>

    // Spread 3 — Page 5 & 6 (Jokes)
    {
      left: {
        pageNum: 5,
        html: `
          <h2>Kuch Hansi Ki Baatein</h2>

          <div class="joke-text" id="jokeBox">Yahan pehla vinyas aayega&hellip; button dabaiye.</div>
          <button class="heart-btn" onclick="nextJoke()">
            <svg class="btn-icon" viewBox="0 0 24 24">
              <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-4 7a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0zm8 0a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0zm-8.5 5.5h9a.75.75 0 0 1 0 1.5h-9a.75.75 0 0 1 0-1.5z"/>
            </svg>
            Ek Aur Dikhayiye
          </button>
        `
      },
      right: {
        pageNum: 6,
        html: `
          <h2>Aapke Baare Mein</h2>
          <p class="date">Jo main kabhi keh nahi paaya</p>
          <p>Aap hansti hain toh lagta hai jaise poori srishti ruk gayi ho.</p>
          <p>Aap naraaz hoti hain toh bhi sundar lagti hain &mdash; kintu woh naraazgi mujhe andar se tod deti hai.</p>
          <p>Aap jab &ldquo;hmm&rdquo; kehti hain, main us ek shabd mein poori kahaani padh leta hoon.</p>
          <p>Aap meri zindagi ka woh anmol hissa hain jo main khona nahi chahta. <span class="hl">Kabhi nahi.</span></p>
        `
      }
    },

    // Spread 4 — Page 7 & 8 (Question)
    {
      left: {
        pageNum: 7,
        html: `
          <h2>Ek Chhota Sa Anurodh</h2>
          <p class="date">Ab bas yeh bata dijiye&hellip;</p>
          <p class="question-text" id="questionText">Kya aap mujhe kshama kar sakti hain?</p>
          <div class="qa-row" id="qaRow">
            <button class="qa-btn qa-yes" id="yesBtn" onclick="sayYes()">Haan</button>
            <button class="qa-btn qa-no" id="noBtn" onclick="sayNo()">Nahi</button>
          </div>
          <p class="no-hint" id="noHint"></p>
        `
      },
      right: {
        pageNum: 8,
        html: `
          <h2>Ek Vachan</h2>
          <p class="date">Likh kar deta hoon</p>
          <p>Main vachan deta hoon&hellip;</p>
          <p>1. Aapki baat dhyan se sununga, bina beech mein bole.</p>
          <p>2. Aapka poora khayal rakhunga &mdash; bhojan, aaram, swasthya, sab.</p>
          <p>3. Aapko kabhi akela mehsoos nahi karne dunga.</p>
          <p>4. Aur jab aap naraaz hongi, main koi halka vinyas sunaunga &mdash; jab tak aap has na dein.</p>
          <p style="font-style:italic; color:#6b2a4a;">Yeh vachan hai. Toota toh&hellip; aap bata dijiye, main sudhar jaunga.</p>
        `
      }
    },

    // Spread 5 — Page 9 & 10 (Final)
    {
      left: {
        pageNum: 9,
        html: `
          <h2>Dhanyavaad</h2>
          <p class="date">Hriday se</p>
          <p>Yeh kitab samapt ho rahi hai&hellip; kintu humari kahaani nahi.</p>
          <p>Aap meri zindagi mein hain, yeh meri sabse badi khushi hai. Aur main is khushi ko kabhi khona nahi chahta.</p>
          <p>Kripya apna poora khayal rakhiye. Samay par bhojan kijiye, aaram kijiye. <span class="hl">Aapka swasthya sarvopari hai.</span></p>
          <div class="signature">&mdash; Aapka, sadaiv</div>
        `
      },
      right: {
        pageNum: 10,
        html: `
          <div class="final-heart"></div>
          <h2 class="final-title">Kshama, Subhashree ji</h2>
          <p class="final-text">
            Yadi aap yahan tak padh aayi hain, toh samajhiye&hellip; aapne mujhe ek avsar diya hai.<br><br>
            Ab ek chhota sa chinh kijiye &mdash; aur mujhe bata dijiye ki aap theek hain.
          </p>
          <button class="wa-btn" onclick="sendToWhatsApp()">
            <svg class="btn-icon" viewBox="0 0 24 24">
              <path d="M12 2A10 10 0 0 0 3.5 17.2L2 22l4.9-1.4A10 10 0 1 0 12 2zm5.5 14.3c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-1.7-.1-1.5-.5-3.4-1.7-4.7-3.4-.6-.8-1-1.7-1.1-2.4-.1-.7.1-1.4.5-1.8.2-.2.4-.3.6-.3h.5c.2 0 .4 0 .5.4l.6 1.4c.1.2.1.4 0 .6l-.4.5c-.1.1-.2.3-.1.5.3.5.8 1.1 1.3 1.5.5.4 1 .7 1.5.9.2.1.4 0 .5-.1l.5-.6c.2-.2.4-.2.6-.1l1.4.6c.4.2.4.3.4.5v.4c0 .2-.1.4-.2.6z"/>
            </svg>
            WhatsApp Par Bhejiye
          </button>
        `
      }
    }
  ];

  let currentSpread = 0;

  function renderBook(direction) {
    const spread = SPREADS[currentSpread];
    const leftContent = document.getElementById('leftContent');
    const rightContent = document.getElementById('rightContent');
    const leftNum = document.getElementById('leftNum');
    const rightNum = document.getElementById('rightNum');

    if (direction === 'next') {
      const flip = document.getElementById('flipRight');
      flip.classList.add('flipping-right');
      setTimeout(() => flip.classList.remove('flipping-right'), 950);
    } else if (direction === 'prev') {
      const flip = document.getElementById('flipLeft');
      flip.classList.add('flipping-left');
      setTimeout(() => flip.classList.remove('flipping-left'), 950);
    }

    setTimeout(() => {
      leftContent.innerHTML = spread.left.html;
      rightContent.innerHTML = spread.right.html;
      leftNum.textContent = spread.left.pageNum;
      rightNum.textContent = spread.right.pageNum;

      document.getElementById('prevBtn').disabled = currentSpread === 0;
      document.getElementById('nextBtn').disabled = currentSpread === SPREADS.length - 1;

      updateVoiceButtons();
    }, direction ? 450 : 0);
  }

  function nextPage() {
    if (currentSpread < SPREADS.length - 1) {
      currentSpread++;
      renderBook('next');
    }
  }
  function prevPage() {
    if (currentSpread > 0) {
      currentSpread--;
      renderBook('prev');
    }
  }

  /* ===== Voice ===== */
  function updateVoiceButtons() {
    const l1 = document.getElementById('voiceLabelLeft');
    const i1 = document.getElementById('voiceIconLeft');
    if (!l1) return;
    if (voicePlaying) {
      l1.textContent = 'Rukiye...';
      if (i1) i1.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
    } else {
      l1.textContent = 'Meri Awaaz Suniye';
      if (i1) i1.innerHTML = '<path d="M8 5v14l11-7z"/>';
    }
  }

  function toggleVoice() {
    if (voicePlaying) {
      voiceAudio.pause();
      voiceAudio.currentTime = 0;
      voicePlaying = false;
      updateVoiceButtons();
      document.getElementById('musicBadge').classList.remove('show');
    } else {
      voiceAudio.volume = 0.4;
      voiceAudio.play().then(() => {
        voicePlaying = true;
        updateVoiceButtons();
        spawnNotes();
        document.getElementById('musicBadge').classList.add('show');
      }).catch(() => {
        const l1 = document.getElementById('voiceLabelLeft');
        if (l1) l1.textContent = 'Punah Dabaiye';
      });
    }
  }

  let noteTimer = null;
  function spawnNotes() {
    if (noteTimer) return;
    noteTimer = setInterval(() => {
      if (!voicePlaying) return;
      const n = document.createElement('div');
      n.className = 'note';
      n.style.left = Math.random() * 100 + 'vw';
      n.style.bottom = '0';
      n.style.animationDuration = (3 + Math.random() * 3) + 's';
      document.body.appendChild(n);
      setTimeout(() => n.remove(), 6500);
    }, 700);
  }

  /* ===== Light-hearted jokes (respectful tone) ===== */
  const jokes = [
    "Mujhe gym chhodna pada &mdash; kyunki aapke saamne toh main pehle se hi bhaavuk hoon, sharirik nahi.",
    "Doctor ne kaha aaram kijiye. Maine kaha &mdash; pehle Subhashree ji ka naraazgi theek ho jaye, phir sochunga.",
    "Meri yantra ki battery 1% par aati hai toh main charger dhoondhta hoon. Aapki muskaan 1% par aati hai toh main duniya bhool jaata hoon.",
    "Aapke bina main aisa hoon jaise bina internet ke phone &mdash; juda dikhta hoon, kintu kaam nahi karta.",
    "Google se poocha &mdash; 'sabse sundar mahila kaun?' Google boli &mdash; 'bhai, aap pehle se jaante hain, jaakar kshama maang lijiye.'",
    "Aap naraaz hoti hain toh bhi sundar lagti hain. Kintu aap hansti hain toh samay ruk jaata hai. Kripya, thodi si muskaan dijiye.",
    "Mera priya samay? Jab aap 'kshama' ke baad 'chalega' kehti hain.",
    "Zindagi mein do cheezein mahatvapurna hain &mdash; chai aur aapki muskaan. Chai mil jaati hai, muskaan ke liye kshama maang raha hoon."
  ];
  let jokeIndex = 0;

  function nextJoke() {
    const jokeBox = document.getElementById('jokeBox');
    if (!jokeBox) return;
    jokeBox.style.opacity = 0;
    setTimeout(() => {
      jokeBox.innerHTML = jokes[jokeIndex % jokes.length];
      jokeBox.style.opacity = 1;
      jokeIndex++;
      burstHearts(6);
    }, 180);
  }

  /* ===== Q&A ===== */
  let noCount = 0;
  const noResponses = [
    "Nahi dabaya? Koi baat nahi, main pratiksha karunga.",
    "Ab bhi nahi? Dekhiye, teddy bhi udaas ho raha hai.",
    "Theek hai, ek aur avsar dijiye&hellip; kripya.",
    "Aapki muskaan toh 'haan' keh rahi hai. Bas ek chhota sa chinh.",
    "Chaliye, main pratiksha karunga. Kintu 'Nahi' button dheere-dheere bhaag raha hai.",
    "Aakhri baar anurodh kar raha hoon&hellip; kripya."
  ];

  function sayNo() {
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const noHint = document.getElementById('noHint');
    if (!noBtn) return;

    noCount++;
    const x = (Math.random() - 0.5) * 150;
    const y = (Math.random() - 0.5) * 50;
    noBtn.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
    noBtn.style.fontSize = Math.max(0.7, 1 - noCount * 0.06) + 'em';

    if (yesBtn) yesBtn.style.transform = 'scale(' + Math.min(1.5, 1 + noCount * 0.1) + ')';

    if (noCount <= noResponses.length && noHint) {
      noHint.textContent = noResponses[noCount - 1];
      noHint.style.opacity = 1;
    }
    if (noCount >= 6) {
      noBtn.style.opacity = 0;
      noBtn.style.pointerEvents = 'none';
    }
  }

  function sayYes() {
    burstHearts(35);
    currentSpread = SPREADS.length - 1;
    renderBook('next');
    if (!voicePlaying) {
      setTimeout(() => {
        voiceAudio.volume = 0.4;
        voiceAudio.play().then(() => {
          voicePlaying = true;
          updateVoiceButtons();
          spawnNotes();
          document.getElementById('musicBadge').classList.add('show');
        }).catch(() => {});
      }, 1200);
    }
  }

  /* ===== WhatsApp ===== */
  const MY_NUMBER = '917854069559';
  function sendToWhatsApp() {
    const message =
      "Subhashree ji, kshama kijiye. Maine bahut galtiyan ki hain. " +
      "Aapka swasthya theek nahi hai, kripya apna poora khayal rakhiye. " +
      "Samay par bhojan kijiye aur aaram kijiye. Main sadaiv aapke saath hoon. " +
      "Kripya ek baar muskura dijiye... Kshama, hriday se kshama.";
    const url = 'https://wa.me/' + MY_NUMBER + '?text=' + encodeURIComponent(message);
    window.open(url, '_blank');
  }
</script>
