<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0510">
<title>AlwaysUs — Hamesha Saath</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Orbitron:wght@400;500;700;900&family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-grid"></div>
<div class="bg-hearts" id="bgHearts"></div>

<div class="wrap">
  <div class="card" id="authCard">

    <div class="head">
      <svg class="heart-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" fill="currentColor"/>
      </svg>
      <h1>Always<span>·</span>Us</h1>
      <p>HAMESHA SAATH · HAMESHA APNA</p>
    </div>

    <div class="divider">
      <span></span><span class="dot"></span><span></span>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabLogin">LOGIN</button>
      <button class="tab-btn" id="tabSignup">SIGN UP</button>
    </div>

    <!-- LOGIN FORM -->
    <form class="form-content active" id="loginForm" autocomplete="off">
      <div class="field">
        <label>Email</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" id="loginEmail" placeholder="your@email.com" required/>
        </div>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="loginPass" placeholder="••••••••" required/>
          <button type="button" class="toggle-pass" onclick="togglePass('loginPass', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-main">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        <span>LOGIN</span>
        <span class="scan"></span>
      </button>
      <div class="status" id="loginStatus">
        <span class="dot"></span>
        <span id="loginMsg">Enter your credentials</span>
      </div>
    </form>

    <!-- SIGNUP FORM -->
    <form class="form-content" id="signupForm" autocomplete="off">
      <div class="field">
        <label>Full Name</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="signupName" placeholder="Your name" required maxlength="30"/>
        </div>
      </div>
      <div class="field">
        <label>Email</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" id="signupEmail" placeholder="your@email.com" required/>
        </div>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="signupPass" placeholder="Min 6 characters" required minlength="6"/>
          <button type="button" class="toggle-pass" onclick="togglePass('signupPass', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label>Date of Birth</label>
        <div class="dob-row">
          <input type="number" id="dobDay" placeholder="DD" min="1" max="31" required/>
          <input type="number" id="dobMonth" placeholder="MM" min="1" max="12" required/>
          <input type="number" id="dobYear" placeholder="YYYY" min="1900" max="2020" required/>
        </div>
      </div>
      <div class="field">
        <label>Gender</label>
        <div class="gender-row">
          <div class="gender-btn" data-gender="male" onclick="selectGender('male')">Male</div>
          <div class="gender-btn" data-gender="female" onclick="selectGender('female')">Female</div>
          <div class="gender-btn" data-gender="other" onclick="selectGender('other')">Other</div>
        </div>
        <input type="hidden" id="signupGender"/>
      </div>
      <button type="submit" class="btn-main">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
        <span>CREATE ACCOUNT</span>
        <span class="scan"></span>
      </button>
      <div class="status" id="signupStatus">
        <span class="dot"></span>
        <span id="signupMsg">Create your account</span>
      </div>
    </form>

    <div class="footer">
      SECURE · PRIVATE · ALWAYS
    </div>

  </div>
</div>

<script src="app.js"></script>
<script>
initHearts();

const USERS_KEY = 'au_users';
const SESSION_KEY = 'au_session';

function getUsers() {
  try { return JSON.parse(localStorage.getItem(USERS_KEY) || '[]'); }
  catch(e) { return []; }
}
function saveUsers(users) { localStorage.setItem(USERS_KEY, JSON.stringify(users)); }

function setStatus(id, msg, type) {
  const el = document.getElementById(id);
  const msgEl = document.getElementById(id === 'loginStatus' ? 'loginMsg' : 'signupMsg');
  msgEl.innerText = msg;
  el.classList.remove('ok', 'err');
  if (type) el.classList.add(type);
}

function shakeCard() {
  const card = document.getElementById('authCard');
  card.classList.add('shake');
  setTimeout(() => card.classList.remove('shake'), 550);
}

function togglePass(inputId, btn) {
  const input = document.getElementById(inputId);
  const isPass = input.type === 'password';
  input.type = isPass ? 'text' : 'password';
  btn.innerHTML = isPass
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function selectGender(g) {
  document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.gender-btn[data-gender="' + g + '"]').classList.add('active');
  document.getElementById('signupGender').value = g;
}

document.getElementById('tabLogin').addEventListener('click', () => {
  document.getElementById('tabLogin').classList.add('active');
  document.getElementById('tabSignup').classList.remove('active');
  document.getElementById('loginForm').classList.add('active');
  document.getElementById('signupForm').classList.remove('active');
});
document.getElementById('tabSignup').addEventListener('click', () => {
  document.getElementById('tabSignup').classList.add('active');
  document.getElementById('tabLogin').classList.remove('active');
  document.getElementById('signupForm').classList.add('active');
  document.getElementById('loginForm').classList.remove('active');
});

document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim().toLowerCase();
  const pass = document.getElementById('signupPass').value;
  const day = document.getElementById('dobDay').value;
  const month = document.getElementById('dobMonth').value;
  const year = document.getElementById('dobYear').value;
  const gender = document.getElementById('signupGender').value;

  if (!name || !email || !pass || !day || !month || !year || !gender) {
    setStatus('signupStatus', 'All fields required', 'err');
    shakeCard();
    return;
  }
  if (pass.length < 6) {
    setStatus('signupStatus', 'Password 6+ characters', 'err');
    shakeCard();
    return;
  }
  const dob = new Date(year, month - 1, day);
  const age = Math.floor((Date.now() - dob.getTime()) / (365.25 * 24 * 60 * 60 * 1000));
  if (age < 13 || age > 100) {
    setStatus('signupStatus', 'Age must be 13+', 'err');
    shakeCard();
    return;
  }

  const users = getUsers();
  if (users.find(u => u.email === email)) {
    setStatus('signupStatus', 'Email already registered', 'err');
    shakeCard();
    return;
  }

  setStatus('signupStatus', 'Creating account...', '');
  await sleep(700);

  const newUser = {
    name, email, password: pass,
    dob: `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`,
    age, gender,
    createdAt: Date.now(),
    token: generateToken(),
  };
  users.push(newUser);
  saveUsers(users);

  localStorage.setItem(SESSION_KEY, JSON.stringify({
    email: newUser.email,
    name: newUser.name,
    age: newUser.age,
    gender: newUser.gender,
    token: newUser.token,
    loginAt: Date.now(),
  }));

  setStatus('signupStatus', 'Account created! Redirecting...', 'ok');
  await sleep(900);
  window.location.href = 'setup.html';
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value;

  if (!email || !pass) {
    setStatus('loginStatus', 'Enter email and password', 'err');
    shakeCard();
    return;
  }

  setStatus('loginStatus', 'Authenticating...', '');
  await sleep(700);

  const users = getUsers();
  const user = users.find(u => u.email === email && u.password === pass);

  if (!user) {
    setStatus('loginStatus', 'Invalid credentials', 'err');
    shakeCard();
    return;
  }

  localStorage.setItem(SESSION_KEY, JSON.stringify({
    email: user.email,
    name: user.name,
    age: user.age,
    gender: user.gender,
    token: user.token,
    loginAt: Date.now(),
  }));

  setStatus('loginStatus', 'Welcome back, ' + user.name + '!', 'ok');
  await sleep(700);

  const companion = localStorage.getItem('au_companion');
  window.location.href = companion ? 'chat.html' : 'setup.html';
});

(function autoRedirect() {
  const raw = localStorage.getItem(SESSION_KEY);
  if (!raw) return;
  try {
    const s = JSON.parse(raw);
    if (s && s.token) {
      const companion = localStorage.getItem('au_companion');
      window.location.replace(companion ? 'chat.html' : 'setup.html');
    }
  } catch(_) {}
})();
</script>
</body>
</html>
